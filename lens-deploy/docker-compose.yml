services:
  lens-web:
    build:
      context: https://github.com/Knight-Shield-Wallet/whitepaper.git#main:lens-deploy/web
    container_name: midnight-lens-web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 8s
    labels:
      - traefik.enable=true
      - traefik.http.routers.midnight-lens-web.entrypoints=websecure
      - traefik.http.routers.midnight-lens-web.rule=Host(`midnight-lens.com`) || Host(`www.midnight-lens.com`)
      - traefik.http.routers.midnight-lens-web.tls.certresolver=letsencrypt
      - traefik.http.services.midnight-lens-web.loadbalancer.server.port=80
    networks:
      - traefik-proxy
      - lens-private

  lens-api:
    image: node:22-alpine
    container_name: midnight-lens-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
    command:
      - node
      - -e
      - |
        const http=require('http');
        const send=(res,code,obj)=>{res.writeHead(code,{'content-type':'application/json','cache-control':'no-store','access-control-allow-origin':'https://midnight-lens.com','vary':'Origin'});res.end(JSON.stringify(obj));};
        http.createServer((req,res)=>{
          if(req.method==='GET'&&req.url==='/health') return send(res,200,{status:'ok',service:'midnight-lens-api',version:'0.1.0'});
          if(req.method==='GET'&&req.url==='/v1/capabilities') return send(res,200,{service:'Midnight Lens',mode:'foundation',capabilities:['selective-disclosure-interface','privacy-receipt-contract','proof-status-contract'],live_proof_issuance:false});
          if(req.url==='/v1/proof-requests') return send(res,501,{error:'proof_issuance_not_enabled',message:'The Lens integration endpoint is reserved and online; live proof issuance is not enabled yet.'});
          return send(res,404,{error:'not_found'});
        }).listen(8080,'0.0.0.0');
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.http.routers.midnight-lens-api.entrypoints=websecure
      - traefik.http.routers.midnight-lens-api.rule=Host(`api.midnight-lens.com`)
      - traefik.http.routers.midnight-lens-api.tls.certresolver=letsencrypt
      - traefik.http.services.midnight-lens-api.loadbalancer.server.port=8080
    networks:
      - traefik-proxy
      - lens-private

  founder-auth:
    build:
      context: https://github.com/Knight-Shield-Wallet/whitepaper.git#main:lens-deploy/founder-auth
    container_name: ksd-founder-auth-rp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
      KSD_FOUNDER_RP_ID: api.midnight-lens.com
      KSD_FOUNDER_RP_NAME: Knight Shield Digital
      KSD_ANDROID_PACKAGE: com.ksd.gameplayer.debug
      KSD_ANDROID_ORIGIN: ${KSD_ANDROID_ORIGIN}
      KSD_ANDROID_CERT_SHA256: ${KSD_ANDROID_CERT_SHA256}
      KSD_FOUNDER_BOOTSTRAP_TOKEN_SHA256: ${KSD_FOUNDER_BOOTSTRAP_TOKEN_SHA256}
      KSD_FOUNDER_SUBJECT: ksd-founder-1
      KSD_FOUNDER_LABEL: Founder
      KSD_FOUNDER_AUTH_STATE_DIR: /data
    volumes:
      - founder-auth-state:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.http.routers.ksd-founder-auth.entrypoints=websecure
      - traefik.http.routers.ksd-founder-auth.rule=Host(`api.midnight-lens.com`) && PathPrefix(`/founder-auth/`)
      - traefik.http.routers.ksd-founder-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.ksd-founder-auth.middlewares=ksd-founder-auth-strip
      - traefik.http.middlewares.ksd-founder-auth-strip.stripprefix.prefixes=/founder-auth
      - traefik.http.routers.ksd-founder-assetlinks.entrypoints=websecure
      - traefik.http.routers.ksd-founder-assetlinks.rule=Host(`api.midnight-lens.com`) && Path(`/.well-known/assetlinks.json`)
      - traefik.http.routers.ksd-founder-assetlinks.tls.certresolver=letsencrypt
      - traefik.http.services.ksd-founder-auth.loadbalancer.server.port=8787
    networks:
      - traefik-proxy
      - lens-private

networks:
  traefik-proxy:
    external: true
  lens-private:
    name: midnight-lens-private
    driver: bridge

volumes:
  founder-auth-state:
    name: ksd-founder-auth-state
