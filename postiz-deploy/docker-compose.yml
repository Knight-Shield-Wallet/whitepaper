services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: unless-stopped
    environment:
      MAIN_URL: ${POSTIZ_MAIN_URL}
      FRONTEND_URL: ${POSTIZ_MAIN_URL}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_MAIN_URL}/api
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      DATABASE_URL: postgresql://postiz-user:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/postiz-db
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'
      RUN_CRON: 'true'
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      API_LIMIT: '30'
      NX_ADD_PLUGINS: 'false'
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    expose:
      - '5000'
    networks:
      - postiz-network
      - temporal-network
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.postiz.entrypoints=websecure
      - traefik.http.routers.postiz.rule=Host(`social.midnight-lens.com`)
      - traefik.http.routers.postiz.tls.certresolver=letsencrypt
      - traefik.http.services.postiz.loadbalancer.server.port=5000
    healthcheck:
      test: ['CMD','node','-e','const r=require("http").get("http://localhost:5000/",res=>process.exit(res.statusCode<500?0:1));r.on("error",()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})']
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 120s
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD}
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U postiz-user -d postiz-db']
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: unless-stopped
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network
    healthcheck:
      test: ['CMD-SHELL','redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s

  temporal-config:
    image: alpine:3.22
    container_name: postiz-temporal-config
    restart: 'no'
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /dynamicconfig
        cat > /dynamicconfig/development-sql.yaml <<'EOF'
        limit.maxIDLength:
          - value: 255
            constraints: {}
        system.forceSearchAttributesCacheRefreshOnRead:
          - value: true
            constraints: {}
        EOF
    volumes:
      - temporal-dynamicconfig:/dynamicconfig

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: postiz-temporal-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - temporal-network
    healthcheck:
      test: ['CMD-SHELL','curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" || exit 1']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  temporal-postgresql:
    image: postgres:16-alpine
    container_name: postiz-temporal-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_USER: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - temporal-network
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U temporal']
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: postiz-temporal
    restart: unless-stopped
    depends_on:
      temporal-config:
        condition: service_completed_successfully
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    volumes:
      - temporal-dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks:
      - temporal-network
    healthcheck:
      test: ['CMD','temporal','operator','cluster','health','--address','temporal:7233']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postiz-postgres-data:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  temporal-postgres-data:
  temporal-elasticsearch-data:
  temporal-dynamicconfig:

networks:
  postiz-network:
  temporal-network:
  traefik-proxy:
    external: true
