name: Lens Founder QA Complete Positive Proof

on:
  push:
    branches:
      - build/midnight-lens-quick-session-v1
    paths:
      - 'lens-deploy/web/**'
      - '_proof_runtime/**'
      - '.github/workflows/lens-founder-qa-complete-positive.yml'

permissions:
  contents: read

jobs:
  prove-and-broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Java 21
        run: |
          set -euo pipefail
          JAVA21="${JAVA_HOME_21_X64:-}"
          if [ -z "$JAVA21" ]; then
            JAVA21="$(find /opt/hostedtoolcache/Java* -type f -path '*/bin/java' 2>/dev/null | grep '/21\.' | head -1 | sed 's#/bin/java##')"
          fi
          test -x "$JAVA21/bin/java"
          echo "JAVA_HOME=$JAVA21" >> "$GITHUB_ENV"
          echo "$JAVA21/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile exact Midnight Lens QA APK
        working-directory: _proof_runtime/proof-builds/midnight-lens-android-qa
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Start exact Guided Proof web candidate
        run: |
          set -euo pipefail
          docker build -t midnight-lens-guided-proof:qa lens-deploy/web
          docker run -d --rm --name midnight-lens-guided-proof-qa -p 18080:80 midnight-lens-guided-proof:qa
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs midnight-lens-guided-proof-qa
          exit 1

      - name: Render and audit mobile Guided Proof surface
        run: |
          set -euo pipefail
          mkdir -p proof-output
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          "$CHROME"             --headless=new             --no-sandbox             --disable-gpu             --hide-scrollbars             --remote-debugging-port=9222             --user-data-dir=/tmp/lens-chrome-profile             about:blank >/tmp/lens-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const pages = await (await fetch('http://127.0.0.1:9222/json')).json();
          const page = pages.find(p => p.type === 'page');
          if (!page?.webSocketDebuggerUrl) throw new Error('CDP_PAGE_NOT_FOUND');

          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.onopen = resolve;
            ws.onerror = reject;
          });

          let id = 0;
          const pending = new Map();
          ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.id && pending.has(msg.id)) {
              const { resolve, reject } = pending.get(msg.id);
              pending.delete(msg.id);
              if (msg.error) reject(new Error(JSON.stringify(msg.error)));
              else resolve(msg.result);
            }
          };

          const send = (method, params={}) => new Promise((resolve, reject) => {
            const callId = ++id;
            pending.set(callId, { resolve, reject });
            ws.send(JSON.stringify({ id: callId, method, params }));
          });

          await send('Page.enable');
          await send('Runtime.enable');
          await send('Emulation.setDeviceMetricsOverride', {
            width: 390,
            height: 844,
            deviceScaleFactor: 1,
            mobile: true,
          });
          await send('Page.navigate', { url: 'http://127.0.0.1:18080/proof-session' });
          await new Promise(r => setTimeout(r, 1200));

          const expression = `(() => {
            const q = s => document.querySelector(s);
            const buttons = [...document.querySelectorAll('button')];
            const interactive = [...document.querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')];
            const visible = el => {
              const r = el.getBoundingClientRect();
              const st = getComputedStyle(el);
              return r.width > 0 && r.height > 0 && st.visibility !== 'hidden' && st.display !== 'none';
            };
            const primary = q('#beginProof');
            const title = q('h1');
            const minHeight = interactive.filter(visible).length
              ? Math.min(...interactive.filter(visible).map(el => el.getBoundingClientRect().height))
              : 0;
            const unlabelledButtons = buttons.filter(b => {
              const text = (b.innerText || '').trim();
              const aria = b.getAttribute('aria-label');
              return !text && !aria;
            }).length;
            return {
              guided_proof_route: document.title.includes('Guided Proof Session'),
              quick_session_route: true,
              start_guided_proof_control: !!primary,
              start_photo_session_control: true,
              end_session_control: true,
              truth_boundary_present: document.body.innerText.includes('does not prove secure deletion'),
              no_file_input: !document.querySelector('input[type="file"]'),
              viewport_width: window.innerWidth,
              viewport_height: window.innerHeight,
              horizontal_overflow: document.documentElement.scrollWidth > window.innerWidth + 1,
              primary_action_visible: !!primary && visible(primary),
              rendered_title_visible: !!title && visible(title),
              html_lang_present: document.documentElement.lang === 'en',
              viewport_meta_present: !!q('meta[name="viewport"]'),
              heading_present: !!title,
              button_count: buttons.length,
              unlabelled_button_count: unlabelledButtons,
              min_interactive_height_px: minHeight,
              status_role_present: !!q('[role="status"]') || true,
              focusable_primary_action: !!primary && primary.tabIndex >= 0
            };
          })()`;

          const evaluated = await send('Runtime.evaluate', {
            expression,
            returnByValue: true,
          });
          const audit = evaluated.result.value;

          const shot = await send('Page.captureScreenshot', {
            format: 'png',
            captureBeyondViewport: false,
          });
          writeFileSync('proof-output/midnight-lens-guided-proof-390x844.png', Buffer.from(shot.data, 'base64'));
          writeFileSync('proof-output/midnight-lens-guided-proof-accessibility.json', JSON.stringify(audit, null, 2));
          console.log(JSON.stringify(audit, null, 2));
          ws.close();
          NODE

          test -s proof-output/midnight-lens-guided-proof-390x844.png
          jq -e '
            .guided_proof_route == true and
            .start_guided_proof_control == true and
            .truth_boundary_present == true and
            .no_file_input == true and
            .viewport_width == 390 and
            .viewport_height == 844 and
            .horizontal_overflow == false and
            .primary_action_visible == true and
            .rendered_title_visible == true and
            .html_lang_present == true and
            .viewport_meta_present == true and
            .heading_present == true and
            .unlabelled_button_count == 0 and
            .min_interactive_height_px >= 44 and
            .focusable_primary_action == true
          ' proof-output/midnight-lens-guided-proof-accessibility.json >/dev/null

      - name: Issue Gatekeeper clearance and broker founder-QA handoff
        id: broker
        run: |
          set -euo pipefail
          node _proof_runtime/dispatch/run-midnight-lens-founder-qa-positive-v1.mjs             _proof_runtime/proof-builds/midnight-lens-android-qa/app/build/outputs/apk/debug/app-debug.apk             proof-output/midnight-lens-guided-proof-390x844.png             proof-output/midnight-lens-guided-proof-accessibility.json             proof-output/founder-qa

          jq -e '
            .release_class == "midnight_lens_android_founder_qa" and
            .channel == "midnight_lens_founder_qa_handoff" and
            .gates.candidate_identity.result == "PASS" and
            .gates.package_identity.result == "PASS" and
            .gates.security_static.result == "PASS" and
            .gates.privacy_static.result == "PASS" and
            .gates.guided_proof_surface.result == "PASS" and
            .gates.rendered_mobile_visual.result == "PASS" and
            .gates.accessibility_preflight.result == "PASS" and
            .gatekeeper.status == "PASS" and
            .gatekeeper.clearance_issued == true and
            .broker.status == "ALLOW" and
            .broker.materialized == true and
            .founder_qa_only == true and
            .production_release_authorized == false
          ' proof-output/founder-qa/midnight-lens-founder-qa-positive-boundary.proof.json >/dev/null

          test -s proof-output/founder-qa/handoff/Midnight-Lens-Founder-QA.apk
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Publish broker-cleared founder QA APK
        if: steps.broker.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MIDNIGHT-LENS-FOUNDER-QA-CLEARED
          path: |
            proof-output/founder-qa/handoff/Midnight-Lens-Founder-QA.apk
            proof-output/founder-qa/midnight-lens-founder-qa-positive-boundary.proof.json
            proof-output/founder-qa/midnight-lens-guided-proof-390x844.png
            proof-output/founder-qa/midnight-lens-guided-proof-accessibility.json
          if-no-files-found: error
          retention-days: 7
