name: Deploy KSDLabs public site

on:
  push:
    branches:
      - deploy/ksdlabs-public-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ksdlabs-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated public branch
        uses: actions/checkout@v4

      - name: Require bounded Pages admin token
        env:
          KSD_PAGES_ADMIN_TOKEN: ${{ secrets.KSD_PAGES_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KSD_PAGES_ADMIN_TOKEN:-}" ]; then
            echo "::error::KSD_PAGES_ADMIN_TOKEN is required. Scope it only to Knight-Shield-Wallet/whitepaper with Pages: write and Administration: write."
            exit 78
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.KSD_PAGES_ADMIN_TOKEN }}

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
