name: Pentagon Secret Audit

on:
  pull_request:
    paths:
      - '.github/workflows/pentagon-secret-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Report approved secret-name availability without exposing values
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          set -euo pipefail
          for name in HOSTINGER_API_KEY OPENAI_API_KEY NOTION_API_KEY N8N_API_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "$name=CONFIGURED"
            else
              echo "$name=MISSING"
            fi
          done
